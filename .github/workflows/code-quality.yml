name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: bash scripts/ci-prepare-env.sh

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: php artisan key:generate --ansi --force

      - run: composer check:quality

  python-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - run: pip install -e ".[dev]"

      - run: ruff check .

      - run: pytest

  php-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, redis
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: bash scripts/ci-prepare-env.sh

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: php artisan key:generate

      - run: npm ci

      - run: npm run build

      - run: php artisan test
        env:
          APP_ENV: testing
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=moderate

      - run: npm run check:all

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: bash scripts/ci-prepare-env.sh

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: php artisan key:generate

      - run: touch database/database.sqlite

      - run: mkdir -p storage/framework/sessions

      - run: php artisan migrate --force
        env:
          APP_ENV: testing
          DB_DATABASE: database/database.sqlite
          SESSION_DRIVER: file

      - run: php artisan db:seed --class=E2eFixturesSeeder --force
        env:
          APP_ENV: testing
          DB_DATABASE: database/database.sqlite
          SESSION_DRIVER: file

      - run: npm ci

      - run: npm run build

      - run: php artisan serve --host=127.0.0.1 --port=8000 &
        env:
          APP_ENV: testing
          DB_DATABASE: database/database.sqlite
          SESSION_DRIVER: file

      - run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/up >/dev/null && exit 0
            sleep 1
          done
          echo "Server did not start" >&2
          exit 1

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
          CI: true

  php-tests-pgsql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: laravel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laravel -d laravel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, pgsql, gd
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: bash scripts/ci-prepare-env.sh

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: php artisan key:generate

      - run: vendor/bin/phpunit --configuration phpunit.integration.xml
        env:
          APP_ENV: testing
          PG_INTEGRATION_TESTS: true
          DB_ALLOW_DESTRUCTIVE: true
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: laravel_test
          DB_USERNAME: laravel
          DB_PASSWORD: secret
