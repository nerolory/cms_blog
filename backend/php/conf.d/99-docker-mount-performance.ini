; Docker Desktop on Windows: project is bind-mounted via 9p (drvfs).
; PHP reads thousands of files per request; without OPcache tuning every page takes seconds.
realpath_cache_size=16M
realpath_cache_ttl=600

opcache.memory_consumption=256
opcache.max_accelerated_files=30000
; Avoid stat() storms on 9p mounts. Restart php container after code changes.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
