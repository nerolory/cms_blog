services:

  php:
    build:
      context: .
      dockerfile: backend/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${HOST_VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - ./backend/php/conf.d/99-docker-mount-performance.ini:/usr/local/etc/php/conf.d/99-docker-mount-performance.ini:ro
      # Bind mounts on Docker Desktop (Windows) do not support utime/touch reliably.
      # Keep compiled Blade views and bootstrap cache on native Linux volumes.
      - laravel_blade_views:/var/www/html/storage/framework/views
      - laravel_bootstrap_cache:/var/www/html/bootstrap/cache
    env_file:
      - .env
    depends_on:
      - database
      - redis
    networks:
      - app_network

  nginx:
    build:
      context: .
      dockerfile: backend/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app_network

  database:
    build:
      context: .
      dockerfile: backend/postgresql/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  redis:
    build:
      context: .
      dockerfile: backend/redis/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - app_network

  queue:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: backend/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - database
      - redis
    networks:
      - app_network

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - app_network

  ai-service:
    profiles: ["ai"]
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_AI_SERVICE_PORT:-8100}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${AI_SERVICE_DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      - database
    networks:
      - app_network

  # Optional search backends — enable with: docker compose --profile search-elasticsearch up -d
  # Set SEARCH_ELASTICSEARCH_ENABLED=true in .env when using a profile below.

